plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace "com.vto.litertbench"
    compileSdk 34

    defaultConfig {
        applicationId "com.vto.litertbench"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    androidResources {
        noCompress 'tflite'
    }

    sourceSets {
        main {
            // models/ at the repo root holds the .tflite files downloaded by scripts/download_models.py
            assets.srcDirs = ['src/main/assets', '../../../models']
        }
    }
}

dependencies {
    implementation 'com.google.ai.edge.litert:litert:2.3.0'
    implementation 'com.google.ai.edge.litert:litert-api:2.3.0'
    implementation 'com.google.ai.edge.litert:litert-gpu:2.3.0'
}
