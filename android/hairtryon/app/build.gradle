plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace "com.vto.hairtryon"
    compileSdk 35

    defaultConfig {
        applicationId "com.vto.hairtryon"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1"

        // hairstyle API (staging): hairapi.url / hairapi.key in local.properties (git-ignored). The key ships inside the APK: staging only.
        def props = new Properties()
        def lp = rootProject.file('local.properties')
        if (lp.exists()) lp.withInputStream { props.load(it) }
        buildConfigField 'String', 'HAIRAPI_URL', "\"${props.getProperty('hairapi.url', 'http://127.0.0.1:8090')}\""
        buildConfigField 'String', 'HAIRAPI_KEY', "\"${props.getProperty('hairapi.key', '')}\""
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    androidResources {
        noCompress 'tflite'
    }

    sourceSets {
        main {
            // models/ at the repo root holds the .tflite files downloaded by scripts/download_models.py
            assets.srcDirs = ['src/main/assets', '../../../models']
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.core:core-ktx:1.15.0'

    def camerax = '1.4.2'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    implementation 'com.google.ai.edge.litert:litert:2.3.0'
    implementation 'com.google.ai.edge.litert:litert-api:2.3.0'
    implementation 'com.google.ai.edge.litert:litert-gpu:2.3.0'

    testImplementation 'junit:junit:4.13.2'
}
